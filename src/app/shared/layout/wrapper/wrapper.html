<div class="shell" role="application" aria-label="Feezer music app">
  <div class="shell__ambient" aria-hidden="true">
    <span class="glow glow--left"></span>
    <span class="glow glow--right"></span>
  </div>

  <header class="mobile-topbar" aria-label="Mobile navigation">
    <button
      class="mobile-menu-btn"
      type="button"
      aria-label="Open navigation menu"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="mobileMenuOpen()"
      (click)="openMobileMenu()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <a class="mobile-brand" routerLink="/home" aria-label="Go to home">
      <span class="mobile-brand__mark" aria-hidden="true">
        <i class="pi pi-headphones"></i>
      </span>
      <span>Feezer</span>
    </a>
  </header>

  <app-sidebar class="desktop-sidebar" aria-hidden="false" (navSelected)="closeMobileMenu()" />

  <p-drawer
    id="mobile-navigation"
    styleClass="mobile-sidebar-drawer"
    position="left"
    [visible]="mobileMenuOpen()"
    (visibleChange)="onDrawerVisibilityChange($event)"
    [showCloseIcon]="false"
    [modal]="true"
    role="dialog"
    aria-label="Navigation menu"
  >
    <app-sidebar (navSelected)="closeMobileMenu()" />
  </p-drawer>

  <main #mainContent class="shell__main" id="main-content" tabindex="-1" aria-label="Main content">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <div class="breadcrumbs__bar">
        <button
          class="breadcrumbs__back"
          type="button"
          aria-label="Go back"
          (click)="navigateBack()"
        >
          <i class="pi pi-arrow-left" aria-hidden="true"></i>
          <span>Back</span>
        </button>

        <ol class="breadcrumbs__list">
          @for (crumb of breadcrumbs(); track crumb.url; let last = $last) {
            <li class="breadcrumbs__item">
              @if (last) {
                <span class="breadcrumbs__current" aria-current="page">{{ crumb.label }}</span>
              } @else {
                <a class="breadcrumbs__link" [routerLink]="crumb.url">{{ crumb.label }}</a>
                <i class="pi pi-angle-right breadcrumbs__separator" aria-hidden="true"></i>
              }
            </li>
          }
        </ol>
      </div>
    </nav>

    <router-outlet (activate)="focusMainContent()" />
  </main>

  <app-playbar />
</div>
