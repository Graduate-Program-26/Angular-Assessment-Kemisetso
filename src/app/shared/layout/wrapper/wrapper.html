<div class="shell" role="application" aria-label="Deezer music app">
  <div class="shell__ambient" aria-hidden="true">
    <span class="glow glow--left"></span>
    <span class="glow glow--right"></span>
  </div>

  <header class="mobile-topbar" aria-label="Mobile navigation">
    <button
      class="mobile-menu-btn"
      type="button"
      aria-label="Open navigation menu"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="mobileMenuOpen()"
      (click)="openMobileMenu()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <a class="mobile-brand" routerLink="/home" aria-label="Go to home">
      <span class="mobile-brand__mark" aria-hidden="true">
        <i class="pi pi-headphones"></i>
      </span>
      <span>Deezer</span>
    </a>
  </header>

  <app-sidebar (navSelected)="closeMobileMenu()"></app-sidebar>

  <p-drawer
    id="mobile-navigation"
    styleClass="mobile-sidebar-drawer"
    position="left"
    [visible]="mobileMenuOpen()"
    (visibleChange)="mobileMenuOpen.set($event)"
  >
    <app-sidebar (navSelected)="closeMobileMenu()"></app-sidebar>
  </p-drawer>

  <main class="shell__main" id="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-playbar></app-playbar>
</div>
