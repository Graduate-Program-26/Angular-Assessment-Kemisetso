<aside class="sidebar" aria-label="Navigation" role="complementary">
  <div class="sidebar__logo" aria-label="SoundSeek">
    <span class="logo-mark" aria-hidden="true">
      <i class="pi pi-headphones"></i>
    </span>
    <span class="logo-text">SoundSeek</span>
  </div>

  <nav class="sidebar__nav" aria-label="Primary navigation">
    <a
      class="nav-item"
      routerLink="/home"
      routerLinkActive="nav-item--active"
      pRipple
      aria-label="Home"
      (click)="closeNavigation()"
    >
      <i class="pi pi-home" aria-hidden="true"></i>
      <span>Home</span>
    </a>

    <a
      class="nav-item"
      routerLink="/search"
      routerLinkActive="nav-item--active"
      pRipple
      aria-label="Search"
      (click)="closeNavigation()"
    >
      <i class="pi pi-search" aria-hidden="true"></i>
      <span>Search</span>
    </a>

    <a
      class="nav-item"
      routerLink="/explore"
      routerLinkActive="nav-item--active"
      pRipple
      aria-label="Explore"
      (click)="closeNavigation()"
    >
      <i class="pi pi-compass" aria-hidden="true"></i>
      <span>Explore</span>
    </a>
  </nav>

  <div class="sidebar__library">
    <div class="library-header">
      <span class="library-title">
        <i class="pi pi-bookmark" aria-hidden="true"></i>
        Your Library
      </span>
    </div>

    <ul class="playlist-list" aria-label="Your playlists">
      <li>
        <a
          class="playlist-item"
          routerLink="/playlists"
          routerLinkActive="playlist-item--active"
          pRipple
          aria-label="All playlists"
          (click)="closeNavigation()"
        >
          <span class="playlist-thumb playlist-thumb--gradient" aria-hidden="true">
            <i class="pi pi-heart-fill"></i>
          </span>
          <div class="playlist-meta">
            <span class="playlist-name">All Playlists</span>
            <span class="playlist-sub">Playlist · {{ playlistStore.playlistCount() }}</span>
          </div>
        </a>
      </li>
      @for (playlist of playlistStore.playlists(); track playlist.id) {
        <li>
          <a
            class="playlist-item"
            [routerLink]="['/playlists', playlist.id]"
            routerLinkActive="playlist-item--active"
            pRipple
            [attr.aria-label]="playlist.name + ', playlist'"
            (click)="closeNavigation()"
          >
            <span class="playlist-thumb" aria-hidden="true">
              <i class="pi pi-heart-fill"></i>
            </span>
            <div class="playlist-meta">
              <span class="playlist-name">{{ playlist.name }}</span>
              <span class="playlist-sub">Playlist</span>
            </div>
          </a>
        </li>
      }
    </ul>
  </div>

  <div class="sidebar__footer">
    <a
      class="new-playlist-btn"
      routerLink="/playlists"
      aria-label="Create new playlist"
      pRipple
      (click)="closeNavigation()"
    >
      <i class="pi pi-plus" aria-hidden="true"></i>
      New playlist
    </a>
  </div>
</aside>
